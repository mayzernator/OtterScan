# Builds OtterScan on a real Mac. Every push and pull request runs build.sh (tests + app build).
# Tags are only checked against the app version; releases are published by hand with the locally built DMG.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15  # Apple Silicon, like the app's target
    steps:
      - uses: actions/checkout@v4

      # The runner context isn't allowed in job-level env, so set TMPDIR from a step.
      - run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Build and test
        run: ./build.sh

      - name: Check the tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          app=$(plutil -extract CFBundleShortVersionString raw OtterScan.app/Contents/Info.plist)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$app" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match the app version $app set in build.sh. Bump build.sh first." >&2
            exit 1
          fi

      # Plain drag-to-Applications disk image. make_dmg.sh's Finder-laid-out window needs a desktop, which CI doesn't have.
      - name: Package
        run: |
          mkdir -p "$RUNNER_TEMP/dmg" dist
          ditto OtterScan.app "$RUNNER_TEMP/dmg/OtterScan.app"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -srcfolder "$RUNNER_TEMP/dmg" -volname OtterScan -fs HFS+ -format UDZO -ov dist/OtterScan.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: OtterScan.dmg
          path: dist/OtterScan.dmg

      # No release publishing here: this runner's older SDK gives the app the old macOS look, and it can't run make_dmg.sh.
      # Releases ship the DMG built locally with ./build.sh && ./make_dmg.sh.
